name: CI

on:
  pull_request:
  push:
    branches: [main]

# Uma nova execução na mesma branch cancela a anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Mesma versão do Node usada na imagem de produção (Dockerfile).
  NODE_VERSION: "22"

jobs:
  build:
    name: Tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run build

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint:prettier:check

  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run test:cobertura

      - name: Publica o relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Valida o Dockerfile de produção sem publicar a imagem.
      - run: docker build --tag ecogestor-app:ci .

  # Check único exigido pela proteção da main. Roda mesmo quando um job falha,
  # porque um check pulado seria considerado aprovado pelo GitHub.
  concluido:
    name: CI concluído
    if: ${{ always() }}
    needs: [build, eslint, prettier, testes, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Confere o resultado de todos os jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "Algum job do CI não foi aprovado."
          exit 1

      - run: echo "Todos os jobs do CI foram aprovados."
